<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lock screen · service alerts</title>
<!-- Demo lock screen with three notifications for the Service Request Automation cover.
     Not part of the site build. A generic iOS-like look: system font, no Apple logos. -->
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: -apple-system, "SF Pro Text", system-ui, "Helvetica Neue", Arial, sans-serif;
    color: #fff; -webkit-font-smoothing: antialiased; overflow: hidden;
    background:
      radial-gradient(120% 70% at 80% 10%, #3f6fa5 0%, rgba(63,111,165,0) 60%),
      radial-gradient(90% 60% at 10% 90%, #e0874a 0%, rgba(224,135,74,0) 55%),
      linear-gradient(170deg, #1e3a5f 0%, #23466f 45%, #6b4b52 100%);
  }
  .status { height: 54px; display: flex; align-items: center; justify-content: flex-end; padding: 8px 28px 0; gap: 6px; }
  .date { text-align: center; font-size: 21px; font-weight: 600; margin-top: 26px; opacity: .92; }
  .clock { text-align: center; font-size: 104px; font-weight: 700; letter-spacing: -.02em; line-height: 1; margin-top: 2px; }
  .stack { padding: 0 10px; margin-top: 118px; display: flex; flex-direction: column; gap: 9px; }
  .note { background: rgba(245,246,250,.86); color: #111; border-radius: 22px; padding: 14px 14px; display: grid; grid-template-columns: 46px 1fr; gap: 11px; align-items: center; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
  .app { width: 46px; height: 46px; border-radius: 11px; display: grid; place-items: center; font-size: 25px; color: #fff; }
  .app.navy { background: #1e3a5f; }
  .app.green { background: #1f9d55; }
  .app.amber { background: #f2a516; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .row b { font-size: 19px; font-weight: 700; }
  .row span { font-size: 15px; color: #555b66; white-space: nowrap; }
  .body { font-size: 20px; line-height: 1.28; margin-top: 2px; font-weight: 500; }
  .body strong { color: #c8102e; }
  .bottom { position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: space-between; padding: 0 46px; }
  .bottom span { width: 50px; height: 50px; border-radius: 50%; background: rgba(0,0,0,.3); display: grid; place-items: center; }
  .home { position: absolute; left: 50%; bottom: 9px; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: #fff; }
</style>
</head>
<body>
  <div class="status" aria-hidden="true">
    <svg width="19" height="12" viewBox="0 0 19 12"><rect x="0" y="8" width="3.2" height="4" rx="1" fill="#fff"/><rect x="5" y="5.5" width="3.2" height="6.5" rx="1" fill="#fff"/><rect x="10" y="3" width="3.2" height="9" rx="1" fill="#fff"/><rect x="15" y="0" width="3.2" height="12" rx="1" fill="#fff"/></svg>
    <svg width="17" height="12" viewBox="0 0 17 12"><path d="M8.5 2.4c2.4 0 4.6.9 6.3 2.5l1.2-1.3A10.6 10.6 0 0 0 8.5.6 10.6 10.6 0 0 0 1 3.6l1.2 1.3a9 9 0 0 1 6.3-2.5zm0 3.6c1.4 0 2.7.5 3.7 1.4l1.2-1.3a7.2 7.2 0 0 0-9.8 0l1.2 1.3c1-.9 2.3-1.4 3.7-1.4zm0 3.5 2-2.1a3 3 0 0 0-4 0z" fill="#fff"/></svg>
    <svg width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" fill="none" stroke="#fff" opacity=".5"/><rect x="2.2" y="2.2" width="17" height="8.6" rx="2" fill="#fff"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" fill="#fff" opacity=".5"/></svg>
  </div>

  <div class="date">Thursday, November 13</div>
  <div class="clock">9:41</div>

  <div class="stack">
    <div class="note">
      <span class="app navy">🔥</span>
      <div>
        <div class="row"><b>Service Alerts</b><span>Just now</span></div>
        <div class="body"><strong>URGENT</strong> · New service request: No heat, Fayetteville</div>
      </div>
    </div>
    <div class="note">
      <span class="app green">✓</span>
      <div>
        <div class="row"><b>Service Alerts</b><span>Just now</span></div>
        <div class="body">Confirmation sent to Sarah M.</div>
      </div>
    </div>
    <div class="note">
      <span class="app amber">⭐</span>
      <div>
        <div class="row"><b>Service Alerts</b><span>1h ago</span></div>
        <div class="body">Review request sent · Job #1042 complete</div>
      </div>
    </div>
  </div>

  <div class="bottom" aria-hidden="true">
    <span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M9 2h6v5l2 3v11a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V10l2-3z"/></svg></span>
    <span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h3l2-2h4l2 2h3a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg></span>
  </div>
  <div class="home"></div>
</body>
</html>
