# Services. One entry per service; this is the single source for the /services page,
# the service detail pages and the "service interested in" dropdown on the contact form.
#   id:       URL slug of the detail page, for example /services/business-websites/
#   order:    position in lists (lower numbers first)
#   group:    id of a group in service-groups.yml
#   summary:  one-line card text
#   includes: "What's included" bullets for the detail page (may be empty)
#   status:   "available" or "coming-soon". Coming-soon services show a badge and have no detail page.
#   whoFor:   "Who it's for" text on the detail page
#   priceNote: optional short price line shown on the card

# ---------- Web Design & Development ----------
- id: business-websites
  order: 1
  group: web-design-development
  title: Business Websites
  summary: A fast, modern site that tells your story and makes it easy to contact you.
  includes:
    - Up to 5–8 pages, custom design matched to your brand
    - Click-to-call, maps, contact forms
    - Mobile-first, tested on every device
  whoFor: Local businesses that need a clear, professional home online and an easy way for customers to get in touch.
  status: available
- id: website-redesign
  order: 2
  group: web-design-development
  title: Website Redesign
  summary: Turn an outdated or confusing site into one customers enjoy using.
  includes:
